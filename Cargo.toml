[workspace]
resolver = "2"
members = [
    "crates/noema-core",
    "crates/noema-api",
    "crates/noema-rig",
    "crates/noema-gemma",
    "crates/noema-needle",
    "crates/noema-needle-static",
    "crates/noema-router",
    "crates/noema-memory",
    "crates/noema-tools",
    "crates/noema-filesearch",
    "crates/noema-approval",
    "crates/noema-context",
    "crates/noema-events",
    "crates/noema-native",
    "crates/noema-provider-http",
    "crates/litert-lm-rust",
    "crates/noema-bridge",
    "examples/basic",
    "examples/needle",
    "examples/gemma",
    "examples/router",
    "examples/multimodal",
    "examples/tools",
    "examples/filesearch",
    "examples/approval",
    "examples/agent",
    "examples/escalation",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Agora"]

[workspace.dependencies]
async-stream = "0.3"
async-trait = "0.1"
futures-util = "0.3"
libloading = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

noema-core = { path = "crates/noema-core", version = "0.1.0" }
noema-api = { path = "crates/noema-api", version = "0.1.0" }
noema-events = { path = "crates/noema-events", version = "0.1.0" }
noema-tools = { path = "crates/noema-tools", version = "0.1.0" }
noema-filesearch = { path = "crates/noema-filesearch", version = "0.1.0" }
noema-approval = { path = "crates/noema-approval", version = "0.1.0" }
noema-context = { path = "crates/noema-context", version = "0.1.0" }
noema-gemma = { path = "crates/noema-gemma", version = "0.1.0" }
noema-needle = { path = "crates/noema-needle", version = "0.1.0" }
noema-rig = { path = "crates/noema-rig", version = "0.1.0" }
noema-router = { path = "crates/noema-router", version = "0.1.0" }
noema-memory = { path = "crates/noema-memory", version = "0.1.0" }
noema-native = { path = "crates/noema-native", version = "0.1.0" }
noema-bridge = { path = "crates/noema-bridge", version = "0.1.0" }
noema-provider-http = { path = "crates/noema-provider-http", version = "0.1.0" }
litert-lm-rust = { path = "crates/litert-lm-rust", version = "0.2", default-features = false }
rig-core = { version = "0.42", default-features = false }
