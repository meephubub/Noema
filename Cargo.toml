[workspace]
resolver = "2"
members = [
    "crates/noema-core",
    "crates/noema-api",
    "crates/noema-rig",
    "crates/noema-gemma",
    "crates/noema-needle",
    "crates/noema-router",
    "crates/noema-memory",
    "crates/noema-tools",
    "crates/noema-approval",
    "crates/noema-context",
    "crates/noema-events",
    "crates/noema-native",
    "crates/litert-lm-rust",
    "examples/basic",
    "examples/needle",
    "examples/gemma",
    "examples/router",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Agora"]

[workspace.dependencies]
async-trait = "0.1"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = "0.3"

noema-core = { path = "crates/noema-core" }
noema-api = { path = "crates/noema-api" }
noema-events = { path = "crates/noema-events" }
noema-tools = { path = "crates/noema-tools" }
noema-approval = { path = "crates/noema-approval" }
noema-context = { path = "crates/noema-context" }
noema-gemma = { path = "crates/noema-gemma" }
noema-needle = { path = "crates/noema-needle" }
noema-rig = { path = "crates/noema-rig" }
noema-router = { path = "crates/noema-router" }
noema-memory = { path = "crates/noema-memory" }
noema-native = { path = "crates/noema-native" }
litert-lm-rust = { path = "crates/litert-lm-rust", default-features = false }
rig-core = { version = "0.42", default-features = false }
